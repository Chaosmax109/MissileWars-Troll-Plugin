  # ---------------- Beispiele für eigene Trolls ----------------
  alarm:
    name: '&cRaketen-Alarm'
    icon: BELL
    description: ['&7Fake-Warnung: Rakete im Anflug!']
    duration: 0
    actions:
      - 'title: &c&lACHTUNG! | &eRakete im Anflug!'
