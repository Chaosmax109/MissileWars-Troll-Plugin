  # ----------------------- Trolls mit Dauer ------------------------
  drunk:
    name: '&dBetrunken'
    icon: HONEY_BOTTLE, POTION
    description: ['&7Übelkeit und Langsamkeit.']
    duration: 15
    actions:
      - 'effect: drunk'

  blind:
    name: '&dBlind'
    icon: INK_SAC
    description: ['&7Blindheit.']
    duration: 10
    actions:
      - 'effect: blind'

  levitate:
    name: '&dSchweben'
    icon: FEATHER
    description: ['&7Ziel schwebt nach oben (kein Fallschaden danach).']
