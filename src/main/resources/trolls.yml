# =====================================================================
#  MissileWars-Troll – trolls.yml
#  Hier stehen ALLE Trolls. Du kannst sie ändern, löschen oder neue
#  hinzufügen. Danach: /mw troll reload
# =====================================================================
#
#  Aufbau eines Trolls:
#
#  trolls:
#    meintroll:                 # ID (klein, ohne Leerzeichen) -> /mw troll meintroll <Ziel>
#      enabled: true            # false = Troll ist aus
#      name: '&6Mein Troll'     # Anzeigename (Menü + Nachrichten)
#      icon: TNT                # Item im Menü (Minecraft-Material, Fallbacks mit Komma: 'A, B')
#      description:             # Beschreibung im Menü
#        - '&7Was der Troll macht'
#      duration: 0              # 0 = Sofort-Troll, sonst Standard-Dauer in Sekunden
#      actions:                 # Was passiert (der Reihe nach)
#        - 'effect: fake_explosion'
#
#  Permission pro Troll:  mwtroll.troll.<id>   (z. B. mwtroll.troll.freeze)
#  Alle Trolls:           mwtroll.troll.*
#
#  --------------------------- AKTIONEN -------------------------------
#  effect: <name>                  eingebauter Effekt (Liste unten)
#  sound: <sound> [laut] [höhe]    z. B. 'sound: entity.ghast.scream 1 0.5' (nur das Ziel hört es)
#  particle: <PARTIKEL> [anzahl]   z. B. 'particle: HEART 20'           (nur das Ziel sieht es)
#  potion: <EFFEKT> [stufe] [sek]  z. B. 'potion: SLOWNESS 2'  (Stufe 0 = I; ohne sek = Troll-Dauer)
#  attribute: <speed|jump|size|gravity> <faktor> [sek]   z. B. 'attribute: size 0.5'
#  velocity: <x> <y> <z>           Spieler wegschleudern (ohne Fallschaden)
#  nofall: <sekunden>              Fallschaden für X Sekunden aus
#  message: <text>                 Nachricht an das Ziel
#  sender-message: <text>          Nachricht an den Troller
#  title: <titel> | <untertitel>   Titel beim Ziel
#  actionbar: <text>               Actionbar beim Ziel
#  broadcast: <text>               Nachricht an alle Spieler
#  console: <befehl>               Befehl als Konsole
#  command: <befehl>               Befehl als Ziel-Spieler
#  give: <MATERIAL> [anzahl]       normales Item geben
#  rocket: <rakete> [anzahl]       MissileWars-Rakete/Schild/arrow/fireball geben
#  nextitems: <item1,item2,...>    nächste MissileWars-Items festlegen
#  delay: <ticks>                  warten (20 Ticks = 1 Sekunde), danach geht's weiter
#
#  Platzhalter: %player% (Ziel), %sender% (Troller), %duration% (Sekunden), %troll% (Name)
#
#  Eingebaute Effekte für "effect:":
#   fake_explosion, creeper, launch, lightning, turn, shuffle, drop, jumpscare,
#   demo, fake_op, cave, drunk, blind, levitate, freeze, spin, tiny, giant,
#   nojump, snail, turbo, moon, glow, pumpkin, chickens
# =====================================================================

trolls:

  # ------------------------- Sofort-Trolls -------------------------
  explosion:
    name: '&6Fake-Explosion'
    icon: TNT
    description: ['&7Knall + Explosion, nur für das Ziel sichtbar.', '&7Kein Schaden.']
    duration: 0
    actions:
      - 'effect: fake_explosion'

  creeper:
    name: '&6Creeper-Zischen'
    icon: CREEPER_HEAD
    description: ['&7Ein Creeper zischt direkt hinter dem Ziel.']
    duration: 0
