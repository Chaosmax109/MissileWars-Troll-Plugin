      - 'delay: 10'
      - 'sound: block.note_block.pling 1 2'
      - 'delay: 10'
      - 'sound: block.note_block.pling 1 2'
      - 'delay: 30'
      - 'effect: fake_explosion'

  fakewin:
    name: '&aFake-Sieg'
    icon: GOLD_BLOCK
    description: ['&7Zeigt dem Ziel einen Sieg-Titel...', '&7...der nicht echt ist.']
    duration: 0
