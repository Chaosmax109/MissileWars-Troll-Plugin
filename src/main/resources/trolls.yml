      - 'effect: shuffle'

  drop:
    name: '&6Item fallen lassen'
    icon: HOPPER
    description: ['&7Das Item in der Hand fällt auf den Boden.']
    duration: 0
    actions:
      - 'effect: drop'

  jumpscare:
    name: '&6Jumpscare'
    icon: PRISMARINE_SHARD
    description: ['&7Wächter-Fluch mit Geräusch mitten ins Gesicht.']
    duration: 0
    actions:
      - 'effect: jumpscare'

  demo:
    name: '&6Demo-Bildschirm'
    icon: PAPER
    description: ['&7Zeigt den Minecraft-Demo-Hinweis an.']
    duration: 0
    actions:
      - 'effect: demo'

  fakeop:
    name: '&6Fake-OP'
    icon: COMMAND_BLOCK
    description: ['&7Täuschend echte "Made ... a server operator"-Nachricht.']
